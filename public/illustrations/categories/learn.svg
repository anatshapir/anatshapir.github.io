<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" role="img" aria-label="A cozy stack of books, a glowing lightbulb, and leafy branches">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff3bf"/>
      <stop offset="1" stop-color="#f7d985"/>
    </linearGradient>
    <linearGradient id="bookBlue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#73c8e7"/><stop offset="1" stop-color="#3399c7"/>
    </linearGradient>
    <linearGradient id="bookCoral" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffb273"/><stop offset="1" stop-color="#ed7652"/>
    </linearGradient>
    <linearGradient id="bookCream" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffdf1"/><stop offset="1" stop-color="#f2dfae"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b9dda0"/><stop offset=".55" stop-color="#69ad7c"/><stop offset="1" stop-color="#377e6b"/>
    </linearGradient>
    <radialGradient id="glow">
