    <path d="m161 118 12 10m2-6 10-11m-10 18 15-7" stroke="#e5f1d4" stroke-width="1"/>
  </g>

  <!-- sharpened pencil at a lively diagonal -->
  <g transform="rotate(24 89 99)" stroke="#17385f" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round">
    <path d="M79 43c0-4 4-7 8-7s8 3 8 7v84l-8 14-8-14Z" fill="url(#pencil)"/>
    <path d="M79 51h16m-16 6h16" fill="none" stroke="#fff0c6" stroke-width="1.5"/>
    <path d="M79 43c0-4 4-7 8-7s8 3 8 7v9H79Z" fill="#e9a0a0"/>
    <path d="m79 127 8 14 8-14Z" fill="#f2d2a1"/>
