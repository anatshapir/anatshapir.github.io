<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" role="img" aria-label="A bright pencil beside an open botanical sketchbook and sprouting leaves">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e3f1ce"/><stop offset="1" stop-color="#b9dca7"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffef5"/><stop offset="1" stop-color="#f2ecd7"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd16d"/><stop offset=".55" stop-color="#f3a541"/><stop offset="1" stop-color="#e87d43"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c6e5a5"/><stop offset=".5" stop-color="#77ba7d"/><stop offset="1" stop-color="#39816d"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <path d="M19 126c-9-24 3-54 27-65 23-11 38-3 58-27 18-21 47-18 69-8 25 11 37 3 61 16 25 14 35 35 29 62-5 22 8 36-11 51-16 12-42 6-63 8-36 4-76-1-112 3-26 3-49-15-58-40Z" fill="url(#wash)" opacity=".55"/>
  <ellipse cx="142" cy="153" rx="101" ry="9" fill="#688e69" opacity=".17" filter="url(#soft)"/>

  <!-- leafy stems peeking around the paper -->
  <g fill="none" stroke="#285e58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43 150c-7-21-3-41 8-58 6-10 7-19 4-29m5 64c7-12 18-20 31-24m-42 5c-9-9-15-18-17-29m177 70c6-22 3-40-8-57-6-10-7-19-4-30m5 62c-8-11-19-19-32-23m41 4c9-10 14-19 16-30"/>
  </g>
  <g fill="url(#leaf)" stroke="#285e58" stroke-width="1.5" stroke-linejoin="round">
    <path d="M55 117c-15-2-24-11-25-23 13 1 23 8 25 23Z"/>
    <path d="M53 98c-2-15 4-25 14-31 4 13 0 24-14 31Z"/>
    <path d="M82 126c1-14 10-23 22-25-1 13-8 21-22 25Z"/>
    <path d="M199 116c15-2 24-11 25-23-13 1-23 8-25 23Z"/>
    <path d="M201 97c2-15-4-25-14-31-4 13 0 24 14 31Z"/>
    <path d="M173 125c-1-14-10-22-22-24 1 12 8 20 22 24Z"/>
    <path d="M41 143c-12-3-19-10-20-19 11 2 18 8 20 19Zm170 0c12-3 19-10 20-19-11 2-18 8-20 19Z"/>
  </g>
  <g fill="none" stroke="#d9edbd" stroke-width="1.1" stroke-linecap="round">
    <path d="m32 95 20 20m13-46L55 97m29 26 12-18m130-10-20 20m-13-47 10 30m-42 10 12 17"/>
  </g>

  <!-- open sketchbook, gently curved page edges -->
  <g stroke="#18375d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="m73 98 57-12c8-2 14 1 16 6l2 54c-5-5-11-7-19-5l-55 12Z" fill="url(#paper)"/>
    <path d="m148 92c4-6 10-8 17-6l49 13-1 55-48-12c-7-2-12 0-16 4Z" fill="url(#paper)"/>
    <path d="M146 95c2 14 2 33 2 51" fill="none" stroke="#c8bfa6" stroke-width="1.7"/>
    <path d="M80 104 126 94m-45 18 44-10m-42 20 39-9m29-12 35 9m-34 2 36 9" fill="none" stroke="#d9d0bb" stroke-width="1.1"/>
    <path d="m76 153 1 7 56-12c7-1 12 1 15 5l1-7c-5-5-10-7-18-5Z" fill="#d9cda9"/>
    <path d="m149 146 1 7c4-4 9-5 16-3l47 13v-8l-48-12c-7-2-12-1-16 3Z" fill="#d9cda9"/>
  </g>

  <!-- hand-drawn sprig on the right page -->
  <g fill="none" stroke="#2d755f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M163 138c6-11 10-21 11-34m0 27c7-5 13-8 20-8m-23 2c-6-6-10-11-12-18m17 6c6-5 9-10 10-16" stroke-width="2"/>
