  <path d="M121 74c3-5 7-7 12-7" fill="none" stroke="#e9a44a" stroke-width="2" stroke-linecap="round"/>
  <path d="M115 67c1-2 3-3 5-4" fill="none" stroke="#e9a44a" stroke-width="1.5" stroke-linecap="round"/>
</svg>